[project]
name = "ampersand-backend"
version = "0.1.0"
description = "Ampersand story-development IDE — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",     # sync driver for Alembic env.py ONLY
    "pgvector>=0.3",

    # Validation + settings
    "pydantic>=2.7",
    "pydantic-settings>=2.2",

    # Auth
    "clerk-backend-api>=1.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",               # async HTTP for JWKS fetch

    # LLM
    "anthropic>=0.26",

    # Embeddings (Voyage AI)
    "voyageai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",              # for TestClient
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# fastapi puts Depends() in argument defaults by design
"app/api/*" = ["B008"]
"app/broadcast/sse.py" = ["B008"]
"app/core/dependencies*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
